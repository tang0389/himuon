<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>
  <style>
    .title { font-size: 18px; font-weight: 600; fill: #1f2937; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .label { font-size: 12px; fill: #374151; }
    .rank0 { fill: #DBEAFE; stroke: #2B5EA7; stroke-width: 1.3; }
    .rank0-label { fill: #2B5EA7; font-size: 12px; font-weight: 600; }
    .rank1 { fill: #FED7AA; stroke: #D4621A; stroke-width: 1.3; }
    .rank1-label { fill: #D4621A; font-size: 12px; font-weight: 600; }
    .cell-text { font-size: 10px; fill: #1f2937; }
    .tile { fill: none; stroke: #C4541A; stroke-width: 2; stroke-dasharray: 5,3; }
    .tile-label { fill: #C4541A; font-size: 11px; font-style: italic; }
    .annot-bad { fill: #C4541A; font-size: 13px; font-weight: 600; }
    .annot-good { fill: #2B7A4B; font-size: 13px; font-weight: 600; }
    .axis-label { fill: #374151; font-size: 12px; font-weight: 600; }
    .axis-line { stroke: #374151; stroke-width: 1.4; }
    .shard-cut { stroke: #DC2626; stroke-width: 2.2; stroke-dasharray: 6,3; fill: none; }
  </style>

  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>

    <!-- Reusable fan (group at origin): 8 NVIDIA-green propeller blades. -->
    <g id="fan">
      <!-- Dark housing rim -->
      <circle cx="0" cy="0" r="5.8" fill="#0a0a0a"/>
      <circle cx="0" cy="0" r="5.3" fill="#1a1a1a"/>
      <!-- 8 green blades forming a dense pinwheel sweep -->
      <g fill="#76B900" stroke="#3c5e08" stroke-width="0.18" stroke-linejoin="round">
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(45)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(90)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(135)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(180)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(225)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(270)"/>
        <path d="M 0.3 -1 C 1.5 -3.2 3.5 -3.8 4.8 -2.2 C 3.2 -0.9 1.4 -0.4 0.3 -1 Z" transform="rotate(315)"/>
      </g>
      <!-- Dark hub with green ring -->
      <circle cx="0" cy="0" r="1.1" fill="#1a1a1a" stroke="#76B900" stroke-width="0.4"/>
    </g>

    <!-- Cartoon-style NVIDIA-themed dual-fan GPU. Native viewBox 60 × 28. -->
    <symbol id="gpu" viewBox="0 0 60 28">
      <!-- I/O metal bracket on the far LEFT (silver, with horizontal vent slots) -->
      <rect x="0" y="0" width="4.5" height="28" fill="#c0c0c0" stroke="#555" stroke-width="0.3"/>
      <g stroke="#3a3a3a" stroke-width="0.4" stroke-linecap="round">
        <line x1="0.8" y1="5"  x2="3.7" y2="5"/>
        <line x1="0.8" y1="8"  x2="3.7" y2="8"/>
        <line x1="0.8" y1="11" x2="3.7" y2="11"/>
        <line x1="0.8" y1="14" x2="3.7" y2="14"/>
        <line x1="0.8" y1="17" x2="3.7" y2="17"/>
        <line x1="0.8" y1="20" x2="3.7" y2="20"/>
        <line x1="0.8" y1="23" x2="3.7" y2="23"/>
      </g>
      <!-- Mounting-screw dots on the bracket flanges -->
      <circle cx="2.25" cy="2"  r="0.5" fill="#555"/>
      <circle cx="2.25" cy="26" r="0.5" fill="#555"/>

      <!-- Main shroud: BLACK body -->
      <rect x="4.5" y="2" width="53.5" height="22" rx="1.5" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>

      <!-- NVIDIA-green top banner (prominent) -->
      <rect x="4.5" y="2" width="53.5" height="3.5" fill="#76B900"/>
      <!-- NVIDIA-green bottom accent stripe -->
      <rect x="4.5" y="22" width="53.5" height="1.6" fill="#76B900"/>

      <!-- Gold-finger PCIe edge at the bottom-left of the main body -->
      <rect x="6" y="24" width="9" height="3.5" fill="#d4a017" stroke="#6b4a0e" stroke-width="0.3"/>
      <rect x="8.5" y="24" width="2" height="2.5" fill="#1a1a1a"/>

      <!-- Outer angular figure-8 frame (white), spanning nearly the
           full shroud. Two diagonals cross at the center (31, 13),
           giving the classic self-crossed "8" outline. -->
      <path d="M 10,3 L 27,3 L 35,23 L 52,23 L 56,19 L 56,7 L 52,3
               L 35,3 L 27,23 L 10,23 L 6,19 L 6,7 Z"
            fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Green circular border ringing each fan, centered in its loop -->
      <g fill="none" stroke="#76B900" stroke-width="1">
        <circle cx="18" cy="13" r="8.5"/>
        <circle cx="44" cy="13" r="8.5"/>
      </g>
      <!-- Two fans centered in each loop of the figure-8 -->
      <use href="#fan" transform="translate(18 13) scale(1.4)"/>
      <use href="#fan" transform="translate(44 13) scale(1.4)"/>
    </symbol>
  </defs>

  <!-- ===== LEFT PANEL: Per-layer FSDP =====
       Matrix body occupies y ∈ [100, 340] (height 240). -->
  <g transform="translate(40,0)">
    <text class="title" x="200" y="38" text-anchor="middle">Per-layer FSDP</text>
    <text class="subtitle" x="200" y="58" text-anchor="middle">each H × W matrix is row-split across ranks</text>

    <rect class="rank0" x="80" y="100" width="240" height="120" />
    <text class="cell-text" x="200" y="165" text-anchor="middle">rows 0 .. H/2</text>
    <rect class="rank1" x="80" y="220" width="240" height="120" />
    <text class="cell-text" x="200" y="285" text-anchor="middle">rows H/2 .. H</text>

    <text class="axis-label" x="65" y="225" text-anchor="end" font-weight="normal" font-style="italic">H</text>
    <text class="axis-label" x="200" y="362" text-anchor="middle" font-weight="normal" font-style="italic">W</text>

    <text class="rank0-label" x="335" y="170">rank 0</text>
    <use href="#gpu" x="380" y="154" width="40" height="19"/>
    <text class="rank1-label" x="335" y="290">rank 1</text>
    <use href="#gpu" x="380" y="274" width="40" height="19"/>

    <rect class="tile" x="140" y="190" width="80" height="80" />
    <text class="tile-label" x="180" y="235" text-anchor="middle">T × T tile</text>

    <text class="annot-bad" x="200" y="410" text-anchor="middle">✗  tile straddles shard boundary</text>
  </g>

  <line x1="480" y1="80" x2="480" y2="420" stroke="#e5e7eb" stroke-width="1" />

  <!-- ===== RIGHT PANEL: Bank sharding =====
       Stack body occupies y ∈ [100, 340] — same vertical extent as left.
       8 slices: Layer 0..3 (rank 0) on top, Layer 4..7 (rank 1) on bottom.
       slab_gap = 28, shard_gap = 50, depth dy = 22, dx = 40.
       Render order: bottom-of-page (Layer 7) first, top-of-page (Layer 0)
       last — so upper slices occlude lower slices' far edges. -->
  <g transform="translate(500,0)">
    <text class="title" x="200" y="38" text-anchor="middle">Parameter-bank sharding</text>
    <text class="subtitle" x="200" y="58" text-anchor="middle">bank (N, H, W) sharded on the layer axis N</text>

    <!-- Layer 7 (rank 1, bottom-most; drawn first) -->
    <polygon class="rank1" points="90,340 270,340 310,318 130,318" />
    <text class="cell-text" x="200" y="334" text-anchor="middle">Layer 7</text>

    <!-- Layer 6 -->
    <polygon class="rank1" points="90,312 270,312 310,290 130,290" />
    <text class="cell-text" x="200" y="306" text-anchor="middle">Layer 6</text>

    <!-- Layer 5 -->
    <polygon class="rank1" points="90,284 270,284 310,262 130,262" />
    <text class="cell-text" x="200" y="278" text-anchor="middle">Layer 5</text>

    <!-- Layer 4 (rank 1 first slice) -->
    <polygon class="rank1" points="90,256 270,256 310,234 130,234" />
    <text class="cell-text" x="200" y="250" text-anchor="middle">Layer 4</text>

    <!-- shard cut: horizontal dashed line midway in the gap between
         Layer 3's bottom edge (y=206) and Layer 4's top edge (y=234) -->
    <line class="shard-cut" x1="70" y1="220" x2="320" y2="220" />
    <text x="325" y="224" font-size="11" fill="#DC2626" font-weight="600">shard cut on N</text>

    <!-- Layer 3 (rank 0 last slice) -->
    <polygon class="rank0" points="90,206 270,206 310,184 130,184" />
    <text class="cell-text" x="200" y="200" text-anchor="middle">Layer 3</text>

    <!-- Layer 2 -->
    <polygon class="rank0" points="90,178 270,178 310,156 130,156" />
    <text class="cell-text" x="200" y="172" text-anchor="middle">Layer 2</text>

    <!-- Layer 1 -->
    <polygon class="rank0" points="90,150 270,150 310,128 130,128" />
    <text class="cell-text" x="200" y="144" text-anchor="middle">Layer 1</text>

    <!-- Layer 0 (top-most; drawn last = on top) -->
    <polygon class="rank0" points="90,122 270,122 310,100 130,100" />
    <text class="cell-text" x="200" y="116" text-anchor="middle">Layer 0</text>

    <!-- rank labels aligned with midline of each rank block -->
    <text class="rank0-label" x="325" y="170">rank 0</text>
    <use href="#gpu" x="370" y="154" width="40" height="19"/>
    <text class="rank1-label" x="325" y="303">rank 1</text>
    <use href="#gpu" x="370" y="287" width="40" height="19"/>

    <!-- 3D axis indicator (top-left corner), origin at (45, 95)
         W: horizontal right
         H: up-right at iso angle (matches slice depth direction)
         N: downward (direction of increasing layer index) -->
    <g>
      <line class="axis-line" x1="45" y1="95" x2="85" y2="95" marker-end="url(#axis-arrow)"/>
      <text class="axis-label" x="90" y="99" font-style="italic">W</text>

      <line class="axis-line" x1="45" y1="95" x2="68" y2="81" marker-end="url(#axis-arrow)"/>
      <text class="axis-label" x="72" y="79" font-style="italic">H</text>

      <line class="axis-line" x1="45" y1="95" x2="45" y2="135" marker-end="url(#axis-arrow)"/>
      <text class="axis-label" x="52" y="148" font-style="italic">N</text>
    </g>

    <text class="annot-good" x="200" y="410" text-anchor="middle">✓  each (H × W) matrix is fully local</text>
  </g>
</svg>
